# Application settings. Secrets and the LLM endpoint live in .env (see .env.example).
app:
  title: Security Posture Dashboard
  team: Data and AI Platform
  data_dir: latest_Data            # folder scanned for the three report files
  server_list: MS_All_servers.xlsx # team server inventory (IP, Application, Enviroment, Hostname)
  environment_overrides: reference/environment_overrides.csv
  # Reference inventory of the AI platform servers. For the servers it lists, its platform name
  # and environment win over what the reports say. Remove the line to switch this off.
  ai_inventory: reference/AI Platforms Inventory -V2.0.xlsx
  # Inventory sheet name -> application name shown in the app. The development lake (Advance)
  # and the production lake (Accelerate) are one platform, so they share a name and get
  # scheduled together: development first, then production.
  ai_inventory_names:
    Advance: AI Data Lake
    Accelerate: AI Data Lake
    R-studio: R-Studio
    DataIku: Dataiku
  cache_dir: .cache

llm:
  # The endpoint comes from LLM_BASE_URL in .env. Any OpenAI-compatible server works
  # (vLLM, Ollama, TGI, LiteLLM ...).
  # Leave model blank to use what the endpoint serves; LLM_MODEL in .env overrides it.
  model: ""
  preferred_models: [gpt-oss-120b, gpt-oss, qwen]   # picked first when the endpoint serves several
  temperature: 0.2
  # Answer budget. Reasoning models such as gpt-oss spend part of it thinking before they write the JSON,
  # so keep it generous. A cut-off answer is retried once with twice this budget.
  max_tokens: 8000
  reasoning_effort: ""   # low / medium / high for reasoning models (gpt-oss); blank = the server's default
  timeout_seconds: 180
  json_mode: true      # ask for response_format=json_object; falls back automatically if unsupported
  max_retries: 1       # extra attempts when the answer is not valid JSON

# Remediation SLA in days per severity (matches the "SLA Breached?" flag in the report).
sla_days:
  Critical: 7
  High: 14
  Medium: 30
  Low: 45
  Minimal: 60
sla_due_soon_days: 3

auth:
  # Sign-in with two roles: admin (every page, plus Settings and Users) and platform owner (every page
  # except those two). Accounts live in users_file, which is git-ignored; passwords only as salted hashes.
  # Create the first admin in a terminal:  python -m tools.auth add <name> --role admin
  enabled: true
  users_file: memory/store/users.json
  session_hours: 12          # signed-in sessions end after this (closing or reloading the page also signs out)
  min_password_length: 12
  max_failures: 5            # wrong passwords in a row before the account is locked for lockout_minutes
  lockout_minutes: 15

ui:
  max_table_rows: 5000   # rows rendered in the browser; downloads always contain everything

email:
  # Email report page. The SMTP relay and its login come from SMTP_* in .env or the environment
  # (see .env.example); nothing secret belongs here.
  subject: "Security posture: {scope} ({date})"   # {scope} and {date} are filled in
  allowed_recipient_domains: []   # e.g. [example.com]; empty = any address
  max_applications_detailed: 15   # applications with their own findings section in the body
  attach_workbook: true           # attach the Excel export for the chosen applications
  max_attachment_mb: 20           # a larger workbook is left out (most relays refuse big mails)
  timeout_seconds: 30
