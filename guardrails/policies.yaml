# Change-window policy. The scheduler and the schedule guardrail both read this file,
# so the model can never place production work outside these rules.

calendar:
  timezone: Asia/Riyadh
  working_days: [Sunday, Monday, Tuesday, Wednesday, Thursday]   # weekend = Friday, Saturday
  working_hours: {start: "08:00", end: "17:00"}
  holidays:
    country: SA                # official Saudi holidays (Eid dates are astronomical estimates)
    freeze_production: true    # no production change on a holiday or the night leading into it
    extra_dates: []            # e.g. ["2026-12-31"] for change freezes or corrected Eid dates
    remove_dates: []           # dates to treat as normal days

production:
  # Production work is only allowed outside working hours, inside these windows.
  night_window: {start: "22:00", end: "05:00"}        # every night
  weekend_day_window: {start: "08:00", end: "20:00"}  # Friday and Saturday daytime
  unknown_environment_is: Production                  # safe default when a server is unmapped

development:
  # Development may be changed at any time. This is only the suggested slot for drafts.
  preferred_window: {start: "09:00", end: "16:00"}

scheduling:
  horizon_days: 28                 # how far ahead windows are offered
  soak_days_before_production: 2   # wait after development before touching production
  canary_fraction: 0.2             # share of production servers in the first wave, when there are 2+ production waves
  max_parallel_servers: 5          # servers worked on at the same time
  waves:                           # a wave = servers changed together (one change to approve); it may span several windows
    default: {Development: 1, Production: 1}   # "One per environment" on the Fix Schedule page
    max_total: 4                   # all environments together; the page lets users pick 1-3 per environment within this
    automatic_split_production_above: 10       # "Automatic" adds a small first production wave above this many servers
  minutes_per_server:
    os_patching: 45
    application_fix: 60
    mbss_hardening: 30
    cs_control: 20

remote_run:
  # "Run on servers" page: SSH from the dashboard host to servers in the reports. Credentials are typed
  # per browser session, kept in memory only and never saved. Every run goes to observability/logs/remote_runs.jsonl.
  enabled: true
  session_minutes: 30          # the login is forgotten after this many minutes without use
  command_timeout_seconds: 300 # default per server; the page allows 10 s to 1 h
  connect_timeout_seconds: 10
  max_servers_per_run: 50
  max_parallel: 10             # servers worked on at the same time
  output_limit_kb: 256         # output kept per server
  allow_other_hosts: false     # true = addresses that are not in the reports may be typed in
  known_hosts_file: ""         # an extra known_hosts file; ~/.ssh/known_hosts is always read

llm_input:
  max_field_chars: 1500       # longer scanner text is truncated before it reaches the model
  max_servers_listed: 60      # above this, the per-server work detail is left out of the scheduling prompt;
                              # server names are always sent so every server can be placed (mask them below)
  mask_ip_addresses: false    # true = replace IPs with server-1, server-2 ... in prompts
  never_send:                 # personal data columns that never leave the app
    - Application Delegate
    - Section Manager
    - Department Director
